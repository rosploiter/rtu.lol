<!DOCTYPE html>
<html>
<head>
    <title>Simple Counter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .counter {
            font-size: 120px;
            font-weight: bold;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="counter" id="counter">...</div>
    <button onclick="incrementCounter()">Increment</button>

    <script>
        const BIN_ID = "67f7eddd8561e97a50fcceb4";
        const API_KEY = "$2a$10$KBcaLicF8fF.dpOPkL2y1uy4vXRawKhodKzEZwTpZt1KgRhkvwySa";
        
        async function initCounter() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: {
                        'X-Master-Key': API_KEY
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('counter').textContent = data.record.count;
                } else {
                    await createCounter();
                }
            } catch (error) {
                console.error("Error initializing counter:", error);
                document.getElementById('counter').textContent = "Error";
            }
        }
        
        async function createCounter() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY,
                        'X-Bin-Name': 'page-counter'
                    },
                    body: JSON.stringify({ count: 0 })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    console.log("Created new bin ID:", data.metadata.id);
                    document.getElementById('counter').textContent = "0";
                }
            } catch (error) {
                console.error("Error creating counter:", error);
                document.getElementById('counter').textContent = "Error";
            }
        }
        
        async function incrementCounter() {
            try {
                const getResponse = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: {
                        'X-Master-Key': API_KEY
                    }
                });
                
                if (getResponse.ok) {
                    const data = await getResponse.json();
                    const currentCount = data.record.count;
                    const newCount = currentCount + 1;
                    
                    const updateResponse = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': API_KEY
                        },
                        body: JSON.stringify({ count: newCount })
                    });
                    
                    if (updateResponse.ok) {
                        document.getElementById('counter').textContent = newCount;
                    }
                }
            } catch (error) {
                console.error("Error incrementing counter:", error);
            }
        }
        
        window.onload = initCounter;
    </script>
</body>
</html>
